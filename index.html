<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish Cipher System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Text to Cipher Converter</h1>
        <p>Enter your text and select a shift key to encrypt your message.</p>
        
        <textarea id="inputText" placeholder="Type your message..."></textarea>
        <input type="number" id="shiftKey" placeholder="Enter shift key" min="1" max="25">
        
        <button onclick="convertCipher()">Convert to Cipher</button>
        
        <h2>Converted Cipher Text</h2>
        <textarea id="outputText" readonly placeholder="Your encrypted text will appear here..."></textarea>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
